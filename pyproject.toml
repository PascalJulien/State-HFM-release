[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shfm"
version = "1.0.0"
description = "State-embedded Hamiltonian Fast Marching for four-wheel-steering forklifts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{ name = "Julien Pascal" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=9.4",
]

[project.urls]
Repository = "https://github.com/PascalJulien/State-HFM"

[project.optional-dependencies]
# cupy is not listed: its pip wheels are tied to one CUDA runtime, so it comes
# from conda (environment.yml) or from the cupy-cudaXXx wheel matching the
# driver. benchmark is what the Bench-MR plotting tools and the build of the
# metric bindings need.
notebooks = ["jupyter", "notebook", "ipykernel", "nbconvert"]
benchmark = ["click", "bitarray", "psutil", "tqdm", "pybind11"]

[tool.setuptools.packages.find]
include = ["shfm*"]
